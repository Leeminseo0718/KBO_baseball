name: Daily KBO collection

on:
  workflow_dispatch:
    inputs:
      date:
        description: KST game date (YYYY-MM-DD)
        required: false
  schedule:
    - cron: "20 16 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect completed games
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PIPELINE_DATE: ${{ inputs.date }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not configured; skipping database collection."
            exit 0
          fi
          python -m kbo_data.pipeline --date "${PIPELINE_DATE:-$(date -u -d '9 hours ago' +%F)}" --mode completed --load-db

