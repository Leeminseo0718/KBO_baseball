name: kbo-data-room

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baseball
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
    ports:
      - "5432:5432"
    volumes:
      - baseball_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://baseball:baseball@postgres:5432/baseball
      ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173,https://baseball-data-room.leeminseo2249.chatgpt.site
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  baseball_pgdata:
